<!doctype html>
<html lang="pt-BR">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<meta name="description" content="Poorgle, uma página de busca inspirada em mecanismos de pesquisa.">
	<title>Poorgle</title>
	<link rel="stylesheet" href="style.css">
</head>
<body>
    <header class="site-header">
		<nav class="main-navigation" aria-label="Navegação principal">
			<div class="navigation-links navigation-links-left">
				<a href="#sobre">Sobre</a>
				<a href="#loja">Loja</a>
			</div>

			<div class="navigation-links navigation-links-right">
				<a href="#email">Pmail</a>
				<a href="#imagens">Imagens</a>
				<a class="apps-link" href="#aplicativos" aria-label="Abrir aplicativos do Poorgle">Aplicativos</a>
				<a class="sign-in-link" href="#entrar">Entrar</a>
			</div>
		</nav>
	</header>
	<main class="search-page">
		<section class="search-area" aria-labelledby="page-title">
			<h1 id="page-title" class="brand-name" aria-label="Poorgle">Poorgle</h1>

			<form class="search-form" action="https://www.google.com/search" method="get">
				<label for="search-input">Pesquisar no Poorgle</label>
				<div class="search-box">
					<span class="search-icon" aria-hidden="true">⌕</span>
					<input
						id="search-input"
						name="q"
						type="search"
						autocomplete="off"
						placeholder="Pesquise no Poorgle"
					>
				</div>

				<div class="search-actions">
					<button type="submit">Pesquisar Poorgle</button>
					<button type="submit" name="btnI" value="1">Estou com sorte</button>
				</div>
			</form>

			<p class="language-message">
				Oferecido em:
				<a href="#portugues">Português</a>
			</p>
		</section>
	</main>
</body>
</html>
